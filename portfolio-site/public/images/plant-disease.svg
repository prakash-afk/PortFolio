<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c14" />
      <stop offset="100%" stop-color="#070b07" />
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#bg3)" />
  <rect width="600" height="360" fill="url(#grid3)" />
  
  <circle cx="300" cy="180" r="130" fill="#22c55e" opacity="0.1" filter="blur(40px)" />

  <g transform="translate(170, 75)">
    <!-- Camera Viewport / Inspection Box -->
    <rect x="0" y="0" width="260" height="195" rx="14" fill="#0f190f" stroke="rgba(34,197,94,0.3)" stroke-width="1.5" />
    
    <!-- Reticle Corners -->
    <path d="M 40 45 L 25 45 L 25 60" fill="none" stroke="#22c55e" stroke-width="2" />
    <path d="M 220 45 L 235 45 L 235 60" fill="none" stroke="#22c55e" stroke-width="2" />
    <path d="M 40 165 L 25 165 L 25 150" fill="none" stroke="#22c55e" stroke-width="2" />
    <path d="M 220 165 L 235 165 L 235 150" fill="none" stroke="#22c55e" stroke-width="2" />

    <!-- Stylized Leaf -->
    <path d="M 130 55 C 80 80, 70 145, 130 155 C 190 145, 180 80, 130 55 Z" fill="#152e18" stroke="#4ade80" stroke-width="2" />
    <line x1="130" y1="58" x2="130" y2="152" stroke="#4ade80" stroke-width="1.5" />
    <path d="M 130 85 Q 150 75 160 80 M 130 110 Q 155 100 165 110 M 130 95 Q 110 85 98 90 M 130 125 Q 105 115 95 125" fill="none" stroke="#4ade80" stroke-width="1.2" opacity="0.7" />

    <!-- Scan Line -->
    <line x1="25" y1="105" x2="235" y2="105" stroke="#86efac" stroke-width="1.5" opacity="0.8" stroke-dasharray="6 3" />

    <!-- Tag badge -->
    <rect x="75" y="165" width="110" height="22" rx="4" fill="#141c14" stroke="#22c55e" stroke-width="1" />
    <text x="130" y="180" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CNN CLASSIFIER</text>
  </g>
</svg>
