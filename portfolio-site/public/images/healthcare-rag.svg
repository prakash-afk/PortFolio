<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#bg1)" />
  <rect width="600" height="360" fill="url(#grid1)" />
  
  <!-- Glowing ambient orb -->
  <circle cx="300" cy="180" r="120" fill="#0ea5e9" opacity="0.12" filter="blur(40px)" />

  <!-- Abstract Document & Vector Node Art -->
  <g transform="translate(180, 80)">
    <!-- Document Card -->
    <rect x="30" y="20" width="180" height="160" rx="12" fill="#1e293b" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
    <line x1="55" y1="50" x2="140" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="70" x2="185" y2="70" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
    <line x1="55" y1="88" x2="170" y2="88" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
    <line x1="55" y1="106" x2="150" y2="106" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />

    <!-- Vector Embeddings Node -->
    <circle cx="170" cy="140" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M162 140 h16 M170 132 v16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Connected Neural / Retrieval Rays -->
    <path d="M198 140 Q250 140 270 100" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="270" cy="100" r="7" fill="#38bdf8" />
    
    <!-- Role Badge -->
    <rect x="55" y="130" width="60" height="20" rx="4" fill="rgba(56,189,248,0.15)" />
    <text x="85" y="144" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RAG-PDF</text>
  </g>
</svg>
