<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e112a" />
      <stop offset="100%" stop-color="#0a050f" />
    </linearGradient>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#bg4)" />
  <rect width="600" height="360" fill="url(#grid4)" />
  
  <circle cx="300" cy="180" r="130" fill="#a855f7" opacity="0.12" filter="blur(40px)" />

  <g transform="translate(160, 80)">
    <!-- Dashboard card -->
    <rect x="0" y="0" width="280" height="190" rx="14" fill="#1b1226" stroke="rgba(168,85,247,0.3)" stroke-width="1.5" />
    
    <!-- Balance bar -->
    <text x="24" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">EXPENSE ANALYTICS</text>
    <text x="24" y="62" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">$2,450.00</text>
    
    <!-- Tier Alert Indicators -->
    <rect x="24" y="85" width="232" height="8" rx="4" fill="#2e1065" />
    <rect x="24" y="85" width="180" height="8" rx="4" fill="#a855f7" />
    
    <!-- Threshold cards -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="70" height="55" rx="8" fill="#120722" stroke="rgba(168,85,247,0.2)" stroke-width="1" />
      <text x="35" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Alert 70%</text>
      <text x="35" y="44" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Normal</text>

      <rect x="81" y="0" width="70" height="55" rx="8" fill="#120722" stroke="rgba(168,85,247,0.2)" stroke-width="1" />
      <text x="116" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Alert 85%</text>
      <text x="116" y="44" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Warning</text>

      <rect x="162" y="0" width="70" height="55" rx="8" fill="#120722" stroke="rgba(168,85,247,0.2)" stroke-width="1" />
      <text x="197" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Alert 95%</text>
      <text x="197" y="44" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Critical</text>
    </g>
  </g>
</svg>
